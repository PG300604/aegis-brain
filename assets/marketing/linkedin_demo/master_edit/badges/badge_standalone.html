<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    width: 650px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .badge-container {
    background: rgba(8, 12, 22, 0.92);
    border: 1.5px solid #0EA5E9;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(14, 165, 233, 0.4);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }
  .badge-tag {
    font-size: 13px;
    font-weight: 800;
    color: #0EA5E9;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .badge-title {
    font-size: 20px;
    font-weight: 800;
    color: #F8FAFC;
    letter-spacing: -0.3px;
  }
  .badge-metric {
    font-size: 14px;
    color: #94A3B8;
    font-weight: 600;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div class="badge-container">
    <div class="badge-tag">🔍 STANDALONE TERMINAL TOOLS</div>
    <div class="badge-title">Cross-Assistant Memory & Audit</div>
    <div class="badge-metric">aegis recall & aegis challenge (VERIFIED_SOUND)</div>
  </div>
</body>
</html>
