<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    width: 650px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .badge-container {
    background: rgba(8, 12, 22, 0.92);
    border: 1.5px solid #A855F7;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(168, 85, 247, 0.4);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }
  .badge-tag {
    font-size: 13px;
    font-weight: 800;
    color: #A855F7;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .badge-title {
    font-size: 20px;
    font-weight: 800;
    color: #F8FAFC;
    letter-spacing: -0.3px;
  }
  .badge-metric {
    font-size: 14px;
    color: #94A3B8;
    font-weight: 600;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div class="badge-container">
    <div class="badge-tag">🛡️ 4-STAGE ARCHITECTURE GATE</div>
    <div class="badge-title">Karpathy Simplicity & AST Defense</div>
    <div class="badge-metric">Zero Over-Engineering • Unslop • Flaw Coaching</div>
  </div>
</body>
</html>
