<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Vox Tape Badge in top-left corner */
  .tape-badge {
    position: absolute;
    top: 40px;
    left: 48px;
    background: #171716;
    color: #EEEDED;
    padding: 9px 20px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 2px;
  }
  .tape-dot {
    width: 8px;
    height: 8px;
    background: #B8433F;
    border-radius: 50%;
  }

  /* Top Right Status Pill */
  .status-tag {
    position: absolute;
    top: 40px;
    right: 48px;
    background: #F6F4EE;
    color: #171716;
    border: 1px solid #D8D4C8;
    padding: 8px 18px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  /* Bottom-Right Evidence Index Card */
  .note-card {
    position: absolute;
    bottom: 64px;
    right: 55px;
    background: #F6F4EE;
    color: #171716;
    border-left: 4px solid #B8433F;
    padding: 14px 22px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 440px;
  }
  .note-num {
    font-size: 22px;
    font-weight: 900;
    color: #B8433F;
    margin-bottom: 3px;
    letter-spacing: -0.5px;
  }
  .note-sub {
    font-size: 11px;
    color: #4B5563;
    font-weight: 600;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class='tape-badge'>
    <div class='tape-dot'></div>
    <span>DOC 08 · CRYPTO SNAPSHOT ROLLBACK</span>
  </div>

  <div class='status-tag'>
    <span>EVIDENCE VERIFIED · AEGIS-BRAIN</span>
  </div>

  
  

  <div class='note-card'>
    <div class='note-num'>8 FILES RESTORED</div>
    <div class='note-sub'>1-click snapshot restore rolls back workspace with zero residual dirt</div>
  </div>
</body>
</html>
