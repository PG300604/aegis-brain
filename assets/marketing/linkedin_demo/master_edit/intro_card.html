<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, #0F172A 0%, #04060A 85%);
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #F8FAFC;
    text-align: center;
  }
  .badge {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid #38BDF8;
    color: #38BDF8;
    padding: 8px 24px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
  }
  .title {
    font-size: 80px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #FFFFFF 0%, #38BDF8 50%, #818CF8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 28px;
    color: #94A3B8;
    max-width: 1100px;
    line-height: 1.45;
    margin-bottom: 48px;
  }
  .metrics-grid {
    display: flex;
    gap: 32px;
    margin-top: 10px;
  }
  .metric-card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 24px 36px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 280px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
  }
  .metric-val {
    font-size: 42px;
    font-weight: 800;
    color: #38BDF8;
    margin-bottom: 6px;
    font-family: ui-monospace, monospace;
  }
  .metric-val.green { color: #34D399; }
  .metric-val.yellow { color: #FBBF24; }
  .metric-lbl {
    font-size: 15px;
    color: #94A3B8;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="badge">Open Source • GNU GPLv3 • v2.4.0</div>
  <h1 class="title">AegisBrain</h1>
  <p class="subtitle">Zero-UI Neural Memory Bus &amp; 3-Tier Token Arbitrage Orchestrator for AI Coding Agents</p>
  
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-val">&lt; 18.2 ms</div>
      <div class="metric-lbl">Sub-Second Memory Recall</div>
    </div>
    <div class="metric-card">
      <div class="metric-val green">92.4%</div>
      <div class="metric-lbl">Token Arbitrage Savings</div>
    </div>
    <div class="metric-card">
      <div class="metric-val yellow">4-Stage</div>
      <div class="metric-lbl">Architecture Quality Gate</div>
    </div>
  </div>
</body>
</html>
