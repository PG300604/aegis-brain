<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="506" height="506" rx="107" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Glow Behind Logo -->
  <circle cx="340" cy="270" r="50" fill="#B91C1C" opacity="0.18" filter="url(#glow)"/>

  <!-- Monogram Logo: AB. / AegisBrain Shield -->
  <g transform="translate(256, 235)">
    <!-- Aegis Shield Icon Contour -->
    <path d="M 0,-120 L 95,-75 C 95,35 60,105 0,140 C -60,105 -95,35 -95,-75 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner Neural Brain Nodes & Core Core -->
    <path d="M -45,-30 C -45,30 0,60 0,85 C 0,60 45,30 45,-30" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8"/>
    <circle cx="0" cy="-25" r="14" fill="#FFFFFF"/>
    <!-- Crimson Pulse Core -->
    <circle cx="0" cy="25" r="10" fill="#B91C1C"/>
  </g>

  <!-- Wordmark Text Below Shield -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5px" fill="#FFFFFF">
    AegisBrain<tspan fill="#B91C1C">.</tspan>
  </text>
</svg>
