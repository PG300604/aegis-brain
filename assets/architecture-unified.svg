    <rect width="474" height="82" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" class="dark-engine-amber" />
    <text x="18" y="26" fill="#B45309" class="card-title text-dark">⚙️ Context Governor &amp; Hardware Sentinel</text>
    <text x="18" y="44" fill="#92400E" class="card-sub text-dark-sub">Caps working context ≤ 400 tokens • Throttles on RAM &lt; 3.5GB</text>
    <rect x="18" y="53" width="330" height="20" class="badge-amber badge-pill" />
    <text x="183" y="67" class="badge-amber-text badge-text" text-anchor="middle">Zero PC Freezes • Native Sleep Prevention (Caffeinate)</text>
