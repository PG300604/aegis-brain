    <text x="16" y="64" fill="#059669" class="badge-text">FTS5 Memory + Decisions</text>
  </g>

  <!-- Target 5: Working Context -->
  <g transform="translate(1052, 496)">
    <rect width="284" height="82" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" class="dark-engine-amber" />
    <text x="16" y="26" fill="#B45309" class="card-title text-dark">ACTIVE_CONTEXT.md</text>
