<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 575" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .box-frame { stroke: #94A3B8; stroke-width: 1.8; stroke-dasharray: 6,6; fill: #F8FAFC; rx: 14; }
      .label-zone { font-family: 'Virgil', 'Comic Sans MS', 'Caveat', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
      .card-title { font-family: 'Virgil', 'Comic Sans MS', -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 500; opacity: 0.88; }
      .edge-label { font-family: 'Virgil', 'Comic Sans MS', -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .arrow { stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      /* Badge pill base */
      .badge-pill { rx: 5; stroke-width: 1.2; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }

      /* Light mode badges */
      .badge-amber { fill: #FDE68A; stroke: #F59E0B; }
      .badge-amber-text { fill: #78350F; }
      .badge-emerald { fill: #A7F3D0; stroke: #10B981; }
      .badge-emerald-text { fill: #064E3B; }
      .badge-violet { fill: #DDD6FE; stroke: #8B5CF6; }
      .badge-violet-text { fill: #4C1D95; }
      .badge-rose { fill: #FECDD3; stroke: #F43F5E; }
      .badge-rose-text { fill: #881337; }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B0D11; }
        .box-frame { fill: #11141C; stroke: #334155; }
        .label-zone { fill: #94A3B8; }
        .dark-client-bg { fill: #0C1E33 !important; stroke: #0284C7 !important; }
        .dark-pill-bg { fill: #16263D !important; stroke: #1E3A5F !important; }
        .dark-pill-title { fill: #38BDF8 !important; }
        .dark-pill-sub { fill: #94A3B8 !important; }
        .dark-engine-amber { fill: #201505 !important; stroke: #D97706 !important; }
        .dark-engine-emerald { fill: #062015 !important; stroke: #059669 !important; }
        .dark-engine-violet { fill: #190F30 !important; stroke: #7C3AED !important; }
        .dark-engine-rose { fill: #280B14 !important; stroke: #E11D48 !important; }
        .text-dark { fill: #F8FAFC !important; }
        .text-dark-sub { fill: #CBD5E1 !important; }

        /* Inner badges dark mode: clean tinted container with colored stroke and luminous text */
        .badge-amber { fill: #382006 !important; stroke: #D97706 !important; stroke-width: 1.2 !important; }
        .badge-amber-text { fill: #FDE68A !important; }
        .badge-emerald { fill: #063824 !important; stroke: #059669 !important; stroke-width: 1.2 !important; }
        .badge-emerald-text { fill: #6EE7B7 !important; }
        .badge-violet { fill: #29154E !important; stroke: #7C3AED !important; stroke-width: 1.2 !important; }
        .badge-violet-text { fill: #DDD6FE !important; }
        .badge-rose { fill: #3C0E1B !important; stroke: #E11D48 !important; stroke-width: 1.2 !important; }
        .badge-rose-text { fill: #FDA4AF !important; }

        /* Edge badges dark mode */
        .edge-pill-amber { fill: #2E1905 !important; stroke: #B45309 !important; }
        .edge-pill-emerald { fill: #062E1D !important; stroke: #047857 !important; }
        .edge-pill-violet { fill: #20113B !important; stroke: #6D28D9 !important; }
        .edge-pill-rose { fill: #330C1A !important; stroke: #BE123C !important; }
      }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C3AED" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1240" height="575" class="bg" rx="12" />

  <!-- ======================================================= -->
  <!-- ZONE 1: SINGLE UNIFIED AI CODING AGENT BOX (LEFT)       -->
  <!-- ======================================================= -->
  <rect x="25" y="30" width="265" height="515" class="box-frame" />
  <text x="45" y="60" class="label-zone">AI CODING AGENTS (ANY RUNTIME)</text>

  <!-- Single Unified Client Box -->
  <g transform="translate(42, 80)">
    <rect width="231" height="445" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.5" class="dark-client-bg" />
    
    <!-- Box Header -->
    <text x="16" y="32" fill="#0369A1" class="card-title text-dark" font-size="16">All AI Coding Agents</text>
    <text x="16" y="50" fill="#0284C7" class="card-sub dark-pill-sub">Irrespective of agent used</text>
    <line x1="16" y1="62" x2="215" y2="62" stroke="#BAE6FD" stroke-width="1.5" />

    <!-- Agent 1: Antigravity -->
    <g transform="translate(12, 74)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ Google Antigravity</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">Claude 3.7 / Gemini 2.5</text>
    </g>

    <!-- Agent 2: Claude Code -->
    <g transform="translate(12, 126)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ Anthropic Claude Code</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">CLI agent &amp; tools</text>
    </g>

    <!-- Agent 3: OpenAI Codex -->
    <g transform="translate(12, 178)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ OpenAI Codex CLI</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">CLI prompt hooks</text>
    </g>

    <!-- Agent 4: Cursor & Windsurf -->
    <g transform="translate(12, 230)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ Cursor &amp; Windsurf</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">.cursorrules / context</text>
    </g>

    <!-- Agent 5: Nous Hermes -->
    <g transform="translate(12, 282)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ Nous Hermes Agent</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">Autonomous reasoning</text>
    </g>

    <!-- Agent 6: Aider & OpenCode -->
    <g transform="translate(12, 334)">
      <rect width="207" height="42" rx="7" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" class="dark-pill-bg" />
      <text x="12" y="22" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="13" font-weight="700" class="dark-pill-title">✦ Aider &amp; OpenCode</text>
      <text x="12" y="35" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">Terminal pair programming</text>
    </g>

    <!-- Footer callout inside the single box -->
    <g transform="translate(12, 386)">
      <rect width="207" height="46" rx="6" fill="#E0F2FE" stroke="#7DD3FC" stroke-dasharray="3,3" class="dark-pill-bg" />
      <text x="12" y="19" fill="#0369A1" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="11.5" font-weight="700" class="dark-pill-title">Universal Memory Channel</text>
      <text x="12" y="34" fill="#0284C7" font-family="ui-monospace, monospace" font-size="10" class="dark-pill-sub">100% shared by all agents</text>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- THE ONE COMMON BUS ARROW (ZONE 1 TO ZONE 2)             -->
  <!-- ======================================================= -->
  <!-- Main connection arrow connecting single box to AegisBrain Daemon -->
  <path d="M 273 302 L 391 302" class="arrow" stroke="#0284C7" stroke-width="3.5" marker-end="url(#arrow-blue)" />

  <!-- Badge over the common arrow -->
  <g transform="translate(283, 260)">
    <rect width="96" height="74" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" class="dark-pill-bg" />
    <text x="48" y="20" fill="#0369A1" class="edge-label dark-pill-title" text-anchor="middle" font-size="10.5">COMMON BUS</text>
    <text x="48" y="36" fill="#0284C7" class="badge-text dark-pill-sub" text-anchor="middle">HTTP :8765</text>
    <text x="48" y="50" fill="#0284C7" class="badge-text dark-pill-sub" text-anchor="middle">CLI / Skills</text>
    <text x="48" y="64" fill="#047857" class="badge-text" text-anchor="middle" font-weight="700">One Ingress</text>
  </g>

  <!-- ======================================================= -->
  <!-- ZONE 2: AEGIS CORE DAEMON CHASSIS (CENTER)              -->
  <!-- ======================================================= -->
  <rect x="395" y="30" width="485" height="515" class="box-frame" />
  <text x="415" y="60" class="label-zone">AEGISBRAIN DAEMON (127.0.0.1:8765)</text>
  <text x="860" y="60" fill="#059669" class="badge-text" font-weight="700" text-anchor="end">● DAEMON ACTIVE</text>

  <!-- Internal Distribution Spine (Universal Access for All Connected Agents) -->
  <path d="M 395 302 L 416 302" stroke="#0284C7" stroke-width="2.5" />
  <path d="M 416 124 L 416 439" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Branches to all 4 engines -->
  <path d="M 416 124 L 434 124" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 416 229 L 434 229" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 416 334 L 434 334" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 416 439 L 434 439" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Core Engine 1: Context Governor -->
  <g transform="translate(434, 81)">
    <rect width="422" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" class="dark-engine-amber" />
    <text x="20" y="28" fill="#B45309" class="card-title text-dark">Deterministic Context Governor</text>
    <text x="20" y="47" fill="#92400E" class="card-sub text-dark-sub">Prunes git diffs, branch state, commits, &amp; tracked PRs</text>
    <rect x="20" y="56" width="270" height="22" class="badge-amber badge-pill" />
    <text x="155" y="71" class="badge-amber-text badge-text" text-anchor="middle">Strict ≤ 400 Token Cap  •  Auto-Load</text>
  </g>

  <!-- Core Engine 2: Neural Memory Bus & Instant Recall -->
  <g transform="translate(434, 186)">
    <rect width="422" height="86" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2" class="dark-engine-emerald" />
    <text x="20" y="28" fill="#047857" class="card-title text-dark">Neural Memory Bus &amp; Instant Recall</text>
    <text x="20" y="47" fill="#065F46" class="card-sub text-dark-sub">SQLite WAL + FTS5 full-text indexing with triggers</text>
    <rect x="20" y="56" width="315" height="22" class="badge-emerald badge-pill" />
    <text x="177.5" y="71" class="badge-emerald-text badge-text" text-anchor="middle">&lt; 50ms Recall ('aegis recall')  •  95%+ Save</text>
  </g>

  <!-- Core Engine 3: Skill Distiller & Proxy -->
  <g transform="translate(434, 291)">
    <rect width="422" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" class="dark-engine-violet" />
    <text x="20" y="28" fill="#6D28D9" class="card-title text-dark">Cross-Model Skill Distiller &amp; Proxy</text>
    <text x="20" y="47" fill="#5B21B6" class="card-sub text-dark-sub">OpenAI-compatible /v1 prompt augmentation reverse proxy</text>
    <rect x="20" y="56" width="275" height="22" class="badge-violet badge-pill" />
    <text x="157.5" y="71" class="badge-violet-text badge-text" text-anchor="middle">Injects 500+ Skills to Local Models</text>
  </g>

  <!-- Core Engine 4: OpenHiggsfield Media Bridge -->
  <g transform="translate(434, 396)">
    <rect width="422" height="86" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2" class="dark-engine-rose" />
    <text x="20" y="28" fill="#BE123C" class="card-title text-dark">OpenHiggsfield Media Bridge</text>
    <text x="20" y="47" fill="#9F1239" class="card-sub text-dark-sub">Zero-dependency stdlib image/video dispatch &amp; indexing</text>
    <rect x="20" y="56" width="285" height="22" class="badge-rose badge-pill" />
    <text x="162.5" y="71" class="badge-rose-text badge-text" text-anchor="middle">Flux 2  •  Seedance  •  Kling  •  Wan 2.6</text>
  </g>

  <!-- ======================================================= -->
  <!-- ZONE 3: STORAGE & TARGET RUNTIMES (RIGHT)               -->
  <!-- ======================================================= -->
  <rect x="965" y="30" width="250" height="515" class="box-frame" />
  <text x="985" y="60" class="label-zone">STORAGE &amp; TARGET RUNTIMES</text>

  <!-- Target 1: ACTIVE_CONTEXT.md -->
  <g transform="translate(980, 81)">
    <rect width="218" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2" class="dark-engine-amber" />
    <text x="18" y="28" fill="#B45309" class="card-title text-dark">ACTIVE_CONTEXT.md</text>
    <text x="18" y="48" fill="#92400E" class="card-sub text-dark-sub">~/.aegis-brain/</text>
    <text x="18" y="65" fill="#D97706" class="badge-text">Auto-read by all agents</text>
  </g>

  <!-- Target 2: brain.db (SQLite) -->
  <g transform="translate(980, 186)">
    <rect width="218" height="86" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2" class="dark-engine-emerald" />
    <text x="18" y="28" fill="#047857" class="card-title text-dark">brain.db (SQLite)</text>
    <text x="18" y="48" fill="#065F46" class="card-sub text-dark-sub">WAL + FTS5 on disk</text>
    <text x="18" y="65" fill="#059669" class="badge-text">Bypassed in private mode</text>
  </g>

  <!-- Target 3: Local Ollama -->
  <g transform="translate(980, 291)">
    <rect width="218" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" class="dark-engine-violet" />
    <text x="18" y="28" fill="#6D28D9" class="card-title text-dark">Local Ollama :11434</text>
    <text x="18" y="48" fill="#5B21B6" class="card-sub text-dark-sub">qwen2.5-coder / deepseek</text>
    <text x="18" y="65" fill="#7C3AED" class="badge-text">Guided by distilled skills</text>
  </g>

  <!-- Target 4: OpenHiggsfield API -->
  <g transform="translate(980, 396)">
    <rect width="218" height="86" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2" class="dark-engine-rose" />
    <text x="18" y="28" fill="#BE123C" class="card-title text-dark">OpenHiggsfield API</text>
    <text x="18" y="48" fill="#9F1239" class="card-sub text-dark-sub">openhiggsfield.ai</text>
    <text x="18" y="65" fill="#E11D48" class="badge-text">Photo &amp; video generation</text>
  </g>

  <!-- ======================================================= -->
  <!-- DOWNSTREAM ARROWS (ZONE 2 TO ZONE 3)                    -->
  <!-- ======================================================= -->
  <!-- Governor -> ACTIVE_CONTEXT.md -->
  <path d="M 856 124 L 975 124" class="arrow" stroke="#D97706" marker-end="url(#arrow-amber)" />
  <rect x="878" y="113" width="80" height="22" rx="5" fill="#FEF3C7" stroke="#FDE68A" class="dark-engine-amber edge-pill-amber" />
  <text x="918" y="128" fill="#92400E" class="edge-label text-dark" text-anchor="middle">compile</text>

  <!-- Memory Bus -> brain.db -->
  <path d="M 856 229 L 975 229" class="arrow" stroke="#059669" marker-end="url(#arrow-green)" />
  <rect x="878" y="218" width="80" height="22" rx="5" fill="#D1FAE5" stroke="#A7F3D0" class="dark-engine-emerald edge-pill-emerald" />
  <text x="918" y="233" fill="#065F46" class="edge-label text-dark" text-anchor="middle">WAL sync</text>

  <!-- Skill Distiller -> Ollama -->
  <path d="M 856 334 L 975 334" class="arrow" stroke="#7C3AED" marker-end="url(#arrow-purple)" />
  <rect x="878" y="323" width="80" height="22" rx="5" fill="#EDE9FE" stroke="#DDD6FE" class="dark-engine-violet edge-pill-violet" />
  <text x="918" y="338" fill="#5B21B6" class="edge-label text-dark" text-anchor="middle">:11434/v1</text>

  <!-- Media Bridge -> OpenHiggsfield -->
  <path d="M 856 439 L 975 439" class="arrow" stroke="#E11D48" marker-end="url(#arrow-rose)" />
  <rect x="878" y="428" width="80" height="22" rx="5" fill="#FFE4E6" stroke="#FECDD3" class="dark-engine-rose edge-pill-rose" />
  <text x="918" y="443" fill="#9F1239" class="edge-label text-dark" text-anchor="middle">dispatch</text>

</svg>