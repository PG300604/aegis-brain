  <text x="915" y="55" fill="#059669" class="badge-text" font-weight="700" text-anchor="end">● DAEMON 24/7 ACTIVE</text>

  <!-- Distribution Spine -->
  <path d="M 408 340 L 426 340" stroke="#0284C7" stroke-width="2.5" />
  <path d="M 426 112 L 426 550" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Branches to 5 Engines -->
  <path d="M 426 112 L 442 112" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 426 218 L 442 218" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 426 324 L 442 324" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 426 430 L 442 430" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 426 536 L 442 536" stroke="#0284C7" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Engine 1: Jev Semantic Decision Engine -->
  <g transform="translate(442, 72)">
    <rect width="474" height="82" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.2" class="dark-engine-violet" />
    <text x="18" y="26" fill="#6D28D9" class="card-title text-dark">⚡ Jev Semantic Decision Head (aegis jev)</text>
    <text x="18" y="44" fill="#5B21B6" class="card-sub text-dark-sub">Sub-3ms token-free risk gating • Prunes 1-3 skills max</text>
    <rect x="18" y="53" width="340" height="20" class="badge-violet badge-pill" />
    <text x="188" y="67" class="badge-violet-text badge-text" text-anchor="middle">2.0ms Latency • CRITICAL Risk Locking • 0 Tokens</text>
  </g>

