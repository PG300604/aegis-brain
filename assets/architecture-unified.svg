  <!-- Target 1: Tier 1 Frontier Manager -->
  <g transform="translate(1052, 72)">
    <rect width="284" height="82" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" class="dark-engine-violet" />
    <text x="16" y="26" fill="#6D28D9" class="card-title text-dark">Tier 1: Frontier Manager</text>
