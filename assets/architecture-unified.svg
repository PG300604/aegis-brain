    <rect width="474" height="82" rx="10" fill="#CFFAFE" stroke="#0891B2" stroke-width="2" class="dark-engine-cyan" />
    <text x="18" y="26" fill="#0E7490" class="card-title text-dark">🛡️ Clean-Room Global Skill Armory (aegis armory)</text>
    <text x="18" y="44" fill="#155E75" class="card-sub text-dark-sub">Central SQLite FTS5 catalog • 4-Gate security quarantine</text>
    <rect x="18" y="53" width="350" height="20" class="badge-cyan badge-pill" />
    <text x="193" y="67" class="badge-cyan-text badge-text" text-anchor="middle">Null-Byte • Prompt Defense • Shell Injection • Secrets</text>
  </g>

  <!-- Engine 3: Unified Unslop-Master Super Skill -->
  <g transform="translate(442, 284)">
    <rect width="474" height="82" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2" class="dark-engine-rose" />
    <text x="18" y="26" fill="#BE123C" class="card-title text-dark">🧼 Unified Unslop-Master (aegis unslop)</text>
    <text x="18" y="44" fill="#9F1239" class="card-sub text-dark-sub">4-Pillar eradication: Code, Prose, Hallmark, &amp; UI slop</text>
    <rect x="18" y="53" width="330" height="20" class="badge-rose badge-pill" />
    <text x="183" y="67" class="badge-rose-text badge-text" text-anchor="middle">2-Stage Deep Scrub • AST Syntax Guard • Anti-Tricolon</text>
  </g>

  <!-- Engine 4: Neural Memory Bus & Instant Recall -->
  <g transform="translate(442, 390)">
    <rect width="474" height="82" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2" class="dark-engine-emerald" />
    <text x="18" y="26" fill="#047857" class="card-title text-dark">🧠 Neural Memory Bus &amp; FTS5 Recall (aegis recall)</text>
    <text x="18" y="44" fill="#065F46" class="card-sub text-dark-sub">SQLite WAL + auto-syncing FTS5 virtual tables</text>
    <rect x="18" y="53" width="310" height="20" class="badge-emerald badge-pill" />
    <text x="173" y="67" class="badge-emerald-text badge-text" text-anchor="middle">0.072ms Latency • 172,000x Faster • 99.5% Token Save</text>
  </g>

  <!-- Engine 5: Context Governor & Hardware Sentinel -->
