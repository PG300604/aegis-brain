<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .box-frame { stroke: #94A3B8; stroke-width: 1.8; stroke-dasharray: 6,6; fill: #F8FAFC; rx: 14; }
      .label-zone { font-family: 'Virgil', 'Comic Sans MS', 'Caveat', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
      .card-title { font-family: 'Virgil', 'Comic Sans MS', -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 500; opacity: 0.88; }
      .edge-label { font-family: 'Virgil', 'Comic Sans MS', -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .arrow { stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .badge-pill { rx: 5; stroke-width: 1.2; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .badge-sky { fill: #BAE6FD; stroke: #0284C7; }
      .badge-sky-text { fill: #0369A1; }
      .badge-amber { fill: #FDE68A; stroke: #F59E0B; }
      .badge-amber-text { fill: #78350F; }
      .badge-emerald { fill: #A7F3D0; stroke: #10B981; }
      .badge-emerald-text { fill: #064E3B; }
      .badge-purple { fill: #DDD6FE; stroke: #8B5CF6; }
      .badge-purple-text { fill: #4C1D95; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B0D11; }
        .box-frame { fill: #11141C; stroke: #334155; }
        .label-zone { fill: #94A3B8; }
        .dark-phone { fill: #0C1E33 !important; stroke: #0284C7 !important; }
        .dark-audio { fill: #1E1B4B !important; stroke: #6366F1 !important; }
        .dark-daemon { fill: #201505 !important; stroke: #D97706 !important; }
        .dark-inject { fill: #06261B !important; stroke: #059669 !important; }
        .text-dark { fill: #F8FAFC !important; }
        .text-dark-sub { fill: #CBD5E1 !important; }
      }
    </style>
    <marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6366F1" />
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="600" y="38" text-anchor="middle" font-family="'Virgil', 'Comic Sans MS', sans-serif" font-size="22" font-weight="700" fill="#0284C7">📱 Telegram 24/7 Mobile Operations &amp; Whisper Voice Pipeline</text>
  <text x="600" y="60" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#64748B">Voice Note &bull; Local Whisper &bull; Win32 Console Injection &bull; Vim-Calibrated Insert Mode Submission</text>

  <!-- COLUMN 1: USER MOBILE PHONE -->
  <rect x="40" y="85" width="240" height="490" class="box-frame" />
  <text x="60" y="110" class="label-zone">1. USER SMARTPHONE</text>

  <rect x="60" y="125" width="200" height="200" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8" class="dark-phone" />
  <text x="75" y="152" class="card-title text-dark" fill="#0369A1">🎙️ Voice Note / Audio</text>
  <text x="75" y="172" class="card-sub text-dark-sub" fill="#0284C7">• Telegram (@HHAACLIBot)</text>
  <text x="75" y="190" class="card-sub text-dark-sub" fill="#0284C7">• Spoken prompt on-the-go</text>
  <text x="75" y="208" class="card-sub text-dark-sub" fill="#0284C7">• Auto-downloaded as .oga</text>
  <rect x="75" y="222" width="115" height="18" class="badge-pill badge-sky" />
  <text x="82" y="235" class="badge-text badge-sky-text">whisper.exe local</text>

  <rect x="60" y="345" width="200" height="210" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8" class="dark-phone" />
  <text x="75" y="372" class="card-title text-dark" fill="#0369A1">💬 Slash Commands</text>
  <text x="75" y="392" class="card-sub text-dark-sub" fill="#0284C7">• /type &lt;cmd&gt; (inject prompt)</text>
  <text x="75" y="410" class="card-sub text-dark-sub" fill="#0284C7">• /altm (in-flight interrupt)</text>
  <text x="75" y="428" class="card-sub text-dark-sub" fill="#0284C7">• /btw &lt;q&gt; (query memory)</text>
  <text x="75" y="446" class="card-sub text-dark-sub" fill="#0284C7">• /lock (secure workstation)</text>
  <text x="75" y="464" class="card-sub text-dark-sub" fill="#0284C7">• /nav (browse session logs)</text>

  <!-- ARROW COL 1 -> COL 2 -->
  <path d="M 280 225 L 340 225" class="arrow" stroke="#0284C7" marker-end="url(#m-sky)" />
  <text x="285" y="215" class="edge-label" fill="#0284C7">Voice Note</text>

  <path d="M 280 435 L 340 435" class="arrow" stroke="#0284C7" marker-end="url(#m-sky)" />
  <text x="290" y="425" class="edge-label" fill="#0284C7">/type</text>

  <!-- COLUMN 2: AUDIO ENGINE & LOCAL WHISPER -->
  <rect x="340" y="85" width="250" height="490" class="box-frame" />
  <text x="360" y="110" class="label-zone">2. WHISPER AUDIO PIPELINE</text>

  <rect x="360" y="125" width="210" height="430" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8" class="dark-audio" />
  <text x="375" y="152" class="card-title text-dark" fill="#312E81">🔊 Local Whisper Engine</text>
  <text x="375" y="176" class="card-sub text-dark-sub" fill="#4338CA">1. Audio Normalization</text>
  <text x="375" y="194" class="card-sub text-dark-sub" fill="#4338CA">   FFmpeg 16kHz mono PCM</text>
  <text x="375" y="222" class="card-sub text-dark-sub" fill="#4338CA">2. Whisper Inference</text>
  <text x="375" y="240" class="card-sub text-dark-sub" fill="#4338CA">   Model: base / local CPU</text>
  <text x="375" y="258" class="card-sub text-dark-sub" fill="#4338CA">   0 cloud API keys required</text>
  <text x="375" y="286" class="card-sub text-dark-sub" fill="#4338CA">3. Accurate Transcription</text>
  <text x="375" y="304" class="card-sub text-dark-sub" fill="#4338CA">   Raw text extracted to disk</text>
  <text x="375" y="322" class="card-sub text-dark-sub" fill="#4338CA">   Prompt tagged as voice</text>
  <text x="375" y="350" class="card-sub text-dark-sub" fill="#4338CA">4. Autopairing &amp; Vault</text>
  <text x="375" y="368" class="card-sub text-dark-sub" fill="#4338CA">   Token securely pinned</text>
  <text x="375" y="386" class="card-sub text-dark-sub" fill="#4338CA">   Inbox logged in brain.db</text>
  <rect x="375" y="420" width="130" height="18" class="badge-pill badge-purple" />
  <text x="382" y="433" class="badge-text badge-purple-text">Offline Privacy Safe</text>

  <!-- ARROW COL 2 -> COL 3 -->
  <path d="M 590 325 L 650 325" class="arrow" stroke="#6366F1" marker-end="url(#m-indigo)" />
  <text x="595" y="315" class="edge-label" fill="#6366F1">Transcript</text>

  <!-- COLUMN 3: AEGIS DAEMON -->
  <rect x="650" y="85" width="240" height="490" class="box-frame" />
  <text x="670" y="110" class="label-zone">3. AEGIS REMOTE DAEMON</text>

  <rect x="670" y="125" width="200" height="430" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" class="dark-daemon" />
  <text x="685" y="152" class="card-title text-dark" fill="#B45309">⚡ aegis.server (:8765)</text>
  <text x="685" y="176" class="card-sub text-dark-sub" fill="#92400E">• 24/7 Background Service</text>
  <text x="685" y="194" class="card-sub text-dark-sub" fill="#92400E">• Win Task KeepAlive</text>
  <text x="685" y="212" class="card-sub text-dark-sub" fill="#92400E">• Caffeinate Wake-Lock</text>
  <text x="685" y="240" class="card-sub text-dark-sub" fill="#92400E">State Manager:</text>
  <text x="685" y="258" class="card-sub text-dark-sub" fill="#92400E">• is_terminal_busy()</text>
  <text x="685" y="276" class="card-sub text-dark-sub" fill="#92400E">• Idle: types &amp; runs now</text>
  <text x="685" y="294" class="card-sub text-dark-sub" fill="#92400E">• Busy: queues for next turn</text>
  <text x="685" y="322" class="card-sub text-dark-sub" fill="#92400E">Live Streamer:</text>
  <text x="685" y="340" class="card-sub text-dark-sub" fill="#92400E">• Monitors transcript.jsonl</text>
  <text x="685" y="358" class="card-sub text-dark-sub" fill="#92400E">• Emits live tokens to phone</text>
  <text x="685" y="376" class="card-sub text-dark-sub" fill="#92400E">• Sends completion banner</text>
  <rect x="685" y="420" width="125" height="18" class="badge-pill badge-amber" />
  <text x="692" y="433" class="badge-text badge-amber-text">Sub-Second Bus</text>

  <!-- ARROW COL 3 -> COL 4 -->
  <path d="M 890 325 L 940 325" class="arrow" stroke="#F59E0B" marker-end="url(#m-amber)" />
  <text x="895" y="315" class="edge-label" fill="#B45309">Win32 API</text>

  <!-- COLUMN 4: DESKTOP CONSOLE & VIM SUBMISSION -->
  <rect x="940" y="85" width="220" height="490" class="box-frame" />
  <text x="955" y="110" class="label-zone">4. CONSOLE &amp; VIM RUN</text>

  <rect x="955" y="125" width="190" height="430" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" class="dark-inject" />
  <text x="968" y="152" class="card-title text-dark" fill="#065F46">💻 Terminal Console</text>
  <text x="968" y="176" class="card-sub text-dark-sub" fill="#047857">1. Win32 Injection</text>
  <text x="968" y="194" class="card-sub text-dark-sub" fill="#047857">   AttachConsole(pid)</text>
  <text x="968" y="212" class="card-sub text-dark-sub" fill="#047857">   WriteConsoleInputW</text>
  <text x="968" y="240" class="card-sub text-dark-sub" fill="#047857">2. Vim Calibration</text>
  <text x="968" y="258" class="card-sub text-dark-sub" fill="#047857">   Esc, Esc &rarr; 'i' (Insert)</text>
  <text x="968" y="276" class="card-sub text-dark-sub" fill="#047857">   Paste command text</text>
  <text x="968" y="304" class="card-sub text-dark-sub" fill="#065F46">3. Direct Enter Submit</text>
  <text x="968" y="322" class="card-sub text-dark-sub" fill="#065F46">   ✅ Stays in INSERT mode</text>
  <text x="968" y="340" class="card-sub text-dark-sub" fill="#065F46">   ✅ 0 Escapes before Enter</text>
  <text x="968" y="358" class="card-sub text-dark-sub" fill="#065F46">   ✅ Immediate Execution</text>
  <text x="968" y="386" class="card-sub text-dark-sub" fill="#047857">4. In-Flight Signal</text>
  <text x="968" y="404" class="card-sub text-dark-sub" fill="#047857">   Alt+M interrupt direct</text>
  <rect x="968" y="435" width="135" height="18" class="badge-pill badge-emerald" />
  <text x="975" y="448" class="badge-text badge-emerald-text">100% Execution Rate</text>
</svg>