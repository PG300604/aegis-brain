<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Dark Matter Gradient -->
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B0E" />
      <stop offset="100%" stop-color="#0E1217" />
    </linearGradient>

    <!-- Technical Terminal Fill -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12161F" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- Precision Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.05)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgPlate)" />
  <rect width="1200" height="340" fill="url(#dotGrid)" />

  <!-- Outer Technical Drafting Frame -->
  <rect x="18" y="18" width="1164" height="304" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
  
  <!-- Precision Corner Crosshairs (+) -->
  <!-- Top Left -->
  <path d="M 12 18 L 24 18 M 18 12 L 18 24" stroke="#38BDF8" stroke-width="1.5" />
  <!-- Top Right -->
  <path d="M 1176 18 L 1188 18 M 1182 12 L 1182 24" stroke="#38BDF8" stroke-width="1.5" />
  <!-- Bottom Left -->
  <path d="M 12 322 L 24 322 M 18 316 L 18 328" stroke="#38BDF8" stroke-width="1.5" />
  <!-- Bottom Right -->
  <path d="M 1176 322 L 1188 322 M 1182 316 L 1182 328" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Top Telemetry Ribbon -->
  <g transform="translate(36, 42)">
    <circle cx="4" cy="4" r="3" fill="#10B981" />
    <text x="14" y="7" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">
      CORE_DAEMON: <tspan fill="#E2E8F0">127.0.0.1:8765</tspan> | STORAGE: <tspan fill="#10B981">SQLITE-WAL</tspan> | MEMORY: <tspan fill="#38BDF8">&lt;25MB</tspan> | TOKEN_GOVERNOR: <tspan fill="#F59E0B">≤400t</tspan>
    </text>
  </g>

  <!-- Left Hero Typography -->
  <g transform="translate(46, 100)">
    <!-- Primary Logotype -->
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      AEGIS<tspan fill="#94A3B8">BRAIN</tspan>
    </text>

    <!-- Subtitle Definition -->
    <text x="2" y="78" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Local Neural Memory Bus &amp; Context Governor
    </text>
    <text x="2" y="100" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400">
      Universal drop-in for Antigravity, Claude Code, Codex, Cursor &amp; Hermes
    </text>

    <!-- Spec Token Badges -->
    <g transform="translate(0, 134)">
      <!-- Token 1 -->
      <rect x="0" y="0" width="134" height="28" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="67" y="18" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">Python 3 Stdlib</text>

      <!-- Token 2 -->
      <rect x="142" y="0" width="134" height="28" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="209" y="18" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">Sub-ms FTS5</text>

      <!-- Token 3 -->
      <rect x="284" y="0" width="134" height="28" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="351" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" text-anchor="middle">GPLv3 Copyleft</text>
    </g>
  </g>

  <!-- Right Hero Terminal Panel (Real Terminal Session) -->
  <g transform="translate(680, 56)">
    <!-- Terminal Chassis -->
    <rect x="0" y="0" width="480" height="230" rx="6" fill="url(#terminalBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="30" rx="6" fill="#161B24" />
    <circle cx="16" cy="15" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="32" cy="15" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="15" r="4.5" fill="#10B981" opacity="0.8" />
    <text x="240" y="19" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="middle">bash // session_boot.sh</text>

    <!-- Terminal Code Body -->
    <g transform="translate(18, 54)">
      <!-- Command 1 -->
      <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ <tspan fill="#F8FAFC" font-weight="600">aegis bootstrap</tspan></text>
      <text x="0" y="18" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">✓ Compiled ACTIVE_CONTEXT.md (382 tokens, 0.04s)</text>

      <!-- Command 2 -->
      <text x="0" y="44" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ <tspan fill="#F8FAFC" font-weight="600">aegis search "cardinality"</tspan></text>
      <text x="0" y="62" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">→ [ARCHITECTURE] GenAI Observation Cardinality (0.4ms)</text>

      <!-- Command 3 -->
      <text x="0" y="88" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ <tspan fill="#F8FAFC" font-weight="600">aegis mode private</tspan></text>
      <text x="0" y="106" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">⚡ Ephemeral stealth active: 0 bytes written to disk</text>

      <!-- Command 4 -->
      <text x="0" y="132" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ <tspan fill="#F8FAFC" font-weight="600">aegis media --model flux-2 --prompt "..."</tspan></text>
      <text x="0" y="150" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">✓ OpenHiggsfield dispatch: asset metadata indexed</text>
    </g>
  </g>
</svg>
