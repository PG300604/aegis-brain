<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="spShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="spCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="spBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="spBg" cx="30%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="45%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#spBg)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1.2">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="400" y1="0" x2="400" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="880" y1="0" x2="880" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1040" y1="0" x2="1040" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
  </g>

  <!-- Left Column: Branding & Value Proposition -->
  <g transform="translate(80, 80)">
    <!-- Small Category Eyebrow -->
    <rect width="185" height="28" rx="6" fill="#0C2340" stroke="#0284C7" stroke-width="1.2" />
    <text x="92.5" y="19" fill="#38BDF8" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">AUTONOMOUS CHASSIS</text>

    <!-- Main Title -->
    <g transform="translate(0, 50)">
      <!-- Integrated Shield Icon in Wordmark -->
      <g transform="translate(0, 10) scale(0.24)">
        <path d="M 128,38 L 198,64 C 198,128 170,182 128,210 C 86,182 58,128 58,64 Z"
              fill="#0F172A" stroke="url(#spShieldGrad)" stroke-width="8" />
        <polygon points="128,91 148,115 128,139 108,115" fill="url(#spCoreGrad)" />
      </g>
      <text x="65" y="55" fill="url(#spBrandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">AegisBrain</text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      Neural Memory Bus &amp; Sub-3ms Semantic Decision Engine
    </text>
    <text x="0" y="190" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Zero external dependencies. 3-tier token arbitrage for AI coding agents.
    </text>

    <!-- Core Feature Pills Grid -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="270" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#38BDF8" />
      <text x="35" y="26" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Sub-3ms Decision Head</text>

      <!-- Pill 2 -->
      <rect x="285" y="0" width="260" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="305" cy="21" r="5" fill="#10B981" />
      <text x="320" y="26" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">FTS5 Memory (&lt; 0.1ms)</text>

      <!-- Pill 3 -->
      <rect x="0" y="54" width="270" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="75" r="5" fill="#8B5CF6" />
      <text x="35" y="80" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Clean-Room Skill Armory</text>

      <!-- Pill 4 -->
      <rect x="285" y="54" width="260" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="305" cy="75" r="5" fill="#F43F5E" />
      <text x="320" y="80" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">Unified Unslop-Master</text>

      <!-- Pill 5 -->
      <rect x="0" y="108" width="545" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="129" r="5" fill="#F59E0B" />
      <text x="35" y="134" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="13" font-weight="600">24/7 Mobile Remote: Offline Whisper • Vim Insert</text>
    </g>

    <!-- Bottom Open Source Badge -->
    <g transform="translate(0, 420)">
      <text x="0" y="20" fill="#475569" font-family="ui-monospace, monospace" font-size="14" font-weight="600">
        python 3.10+ • 236 tests passing • pure standard library • GPLv3
      </text>
    </g>
  </g>

  <!-- Right Column: Live Telemetry & Architecture Telemetry Card -->
  <g transform="translate(680, 75)" filter="url(#spGlow)">
    <rect width="520" height="490" rx="16" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="2" />

    <!-- Card Header -->
    <g transform="translate(30, 32)">
      <circle cx="6" cy="6" r="6" fill="#EF4444" opacity="0.8" />
      <circle cx="26" cy="6" r="6" fill="#F59E0B" opacity="0.8" />
      <circle cx="46" cy="6" r="6" fill="#10B981" opacity="0.8" />
      <text x="80" y="10" fill="#64748B" font-family="ui-monospace, monospace" font-size="13" font-weight="600">aegis telemetry status</text>
      <line x1="0" y1="26" x2="460" y2="26" stroke="#1E293B" stroke-width="1.5" />
    </g>

    <!-- Metric Row 1: Context Window Reduction -->
    <g transform="translate(30, 85)">
      <rect width="460" height="74" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="28" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">CONTEXT PAYLOAD (PER TURN)</text>
      <text x="20" y="56" fill="#10B981" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">94% Saved</text>
      <text x="180" y="54" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">3,200 vs 52,400 tokens</text>
    </g>

    <!-- Metric Row 2: Cold Startup Time -->
    <g transform="translate(30, 175)">
      <rect width="460" height="74" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="28" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">COLD BOOT &amp; ROUTING LATENCY</text>
      <text x="20" y="56" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">42 ms</text>
      <text x="130" y="54" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">90x faster than 3,850ms</text>
    </g>

    <!-- Metric Row 3: Token Arbitrage Cost Delta -->
    <g transform="translate(30, 265)">
      <rect width="460" height="74" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="28" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">COST PER 1,000 LOC SYNTHESIS</text>
      <text x="20" y="56" fill="#A78BFA" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">$0.42</text>
      <text x="120" y="54" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">97.7% offload vs $18.50</text>
    </g>

    <!-- Terminal Micro-Log Box -->
    <g transform="translate(30, 355)">
      <rect width="460" height="100" rx="8" fill="#050811" stroke="#0F172A" stroke-width="1" />
      <text x="16" y="28" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11.5">$ aegis jev decide "Generate 15 slide masterclass"</text>
      <text x="16" y="50" fill="#10B981" font-family="ui-monospace, monospace" font-size="11.5">✓ Risk: LOW • Worker: hermes (Tier 3) • 2.7ms</text>
      <text x="16" y="72" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11.5">✓ Context Pruned: python, ui-ux-pro-max (1-3 max)</text>
    </g>
  </g>
</svg>
