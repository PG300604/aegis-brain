<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="104" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Background Grid Accent -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Outer Protective Aegis Shield -->
  <path d="M 256,76 L 396,128 C 396,256 340,364 256,420 C 172,364 116,256 116,128 Z"
        fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Shield Inset Glow -->
  <path d="M 256,98 L 372,142 C 372,246 324,338 256,386 C 188,338 140,246 140,142 Z"
        fill="url(#glowGrad)" stroke="#38BDF8" stroke-width="1.8" opacity="0.6" stroke-dasharray="6,4" />

  <!-- Neural Core Lattice -->
  <!-- Upper Left Branch -->
  <line x1="256" y1="230" x2="196" y2="175" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <!-- Upper Right Branch -->
  <line x1="256" y1="230" x2="316" y2="175" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <!-- Mid Left Branch -->
  <line x1="256" y1="230" x2="185" y2="270" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <!-- Mid Right Branch -->
  <line x1="256" y1="230" x2="327" y2="270" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Stem Branch -->
  <line x1="256" y1="230" x2="256" y2="330" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />

  <!-- Peripheral Neural Nodes -->
  <circle cx="196" cy="175" r="9" fill="#0369A1" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="316" cy="175" r="9" fill="#0369A1" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="185" cy="270" r="8" fill="#312E81" stroke="#818CF8" stroke-width="2.5" />
  <circle cx="327" cy="270" r="8" fill="#312E81" stroke="#818CF8" stroke-width="2.5" />
  <circle cx="256" cy="330" r="7" fill="#4C1D95" stroke="#A78BFA" stroke-width="2.5" />

  <!-- Central Diamond Processor Core -->
  <polygon points="256,182 296,230 256,278 216,230" fill="#0A0E1A" stroke="url(#coreGrad)" stroke-width="4.5" />
  <polygon points="256,198 282,230 256,262 230,230" fill="url(#coreGrad)" />
  <circle cx="256" cy="230" r="4.5" fill="#FFFFFF" />

  <!-- Floating Synapse Points -->
  <circle cx="256" cy="130" r="3.5" fill="#38BDF8" opacity="0.9" />
  <circle cx="210" cy="310" r="2.5" fill="#818CF8" opacity="0.7" />
  <circle cx="302" cy="310" r="2.5" fill="#818CF8" opacity="0.7" />
</svg>
