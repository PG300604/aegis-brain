[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-brain"
version = "0.1.0"
description = "Local Neural Memory Bus, Agent Orchestrator & Cross-Model Skill Distillation System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Ghosh", email = "priyanshughosh97@gmail.com" }
]
keywords = ["ai-agents", "memory", "orchestration", "ollama", "antigravity", "hermes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
fast = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
vector = [
    "lancedb>=0.6.0",
    "fastembed>=0.2.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
