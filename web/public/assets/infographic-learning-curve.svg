    .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .text-metric { font-family: 'Patrick Hand', 'Caveat', 'Comic Sans MS', cursive, sans-serif; font-size: 46px; font-weight: 700; }
]]>
    </style>
