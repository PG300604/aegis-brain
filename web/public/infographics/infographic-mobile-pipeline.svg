      <text x="0" y="38" class="font-mono" font-size="10" fill="#E4E4E7">Telegram Audio (0.4s) → Slicer (0.02s) → Local Whisper (0.48s) → In-Flight Terminal (0.05s) = <tspan font-weight="700" fill="#10B981">&lt; 1.0s Total Roundtrip</tspan></text>
      <text x="0" y="58" class="font-mono" font-size="10" fill="#9CA3AF">286/286 pytest tests passing • Tested across Windows 11 host with Telegram Bot API v7.2</text>
    </g>
  </g>

  <!-- Footer Specs -->
  <g transform="translate(40, 765)">
    <text x="0" y="0" class="font-mono" font-size="10" fill="#71717A">MOBILE TELEMETRY SPEC: Telegram Bot API v7.2 • FFmpeg Opus Transcoder • Local Whisper C++ • Win32 Input Hook</text>
    <text x="960" y="0" text-anchor="end" class="font-mono" font-size="10" fill="#D4AF37">P:\open-sourceegis-brain\packageegisemote	elegram_bot.py</text>
  </g>
</svg>