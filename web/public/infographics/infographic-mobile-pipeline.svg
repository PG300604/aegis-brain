<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    ]]></style>
    <filter id="brutalist-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect width="1040" height="800" rx="16" fill="#090A0F" stroke="#262738" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="960" height="76" rx="8" fill="#12131C" stroke="#D4AF37" stroke-width="1.8" filter="url(#brutalist-shadow)" />
    <!-- Seal Badge -->
    <rect x="18" y="14" width="48" height="48" rx="6" fill="#1C1D2B" stroke="#D4AF37" stroke-width="1.2" />
    <rect x="34" y="24" width="16" height="28" rx="2" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="42" cy="46" r="1.5" fill="#B91C1C" />

    <text x="82" y="34" class="font-sans" font-size="11" font-weight="700" fill="#D4AF37" letter-spacing="2">MOBILE TELEMETRY // WHISPER SHIELD</text>
    <text x="82" y="58" class="font-sans" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">24/7 MOBILE TELEGRAM PIPELINE &amp; IN-FLIGHT CONTROL</text>
    <text x="880" y="46" text-anchor="end" class="font-mono" font-size="12" font-weight="700" fill="#10B981">0% DROP RATE</text>
  </g>

  <!-- 4 HORIZONTAL STEPS -->
  <g transform="translate(40, 130)">
    <!-- STEP 1: MOBILE TELEGRAM AUDIO -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="480" rx="8" fill="#12131C" stroke="#3B82F6" stroke-width="1.6" filter="url(#brutalist-shadow)" />
      <rect x="14" y="16" width="100" height="24" rx="4" fill="#122544" stroke="#3B82F6" stroke-width="1" />
      <text x="64" y="32" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#93C5FD">STEP 01</text>
      
      <text x="14" y="66" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Voice Ingestion</text>
      <text x="14" y="86" class="font-mono" font-size="10" fill="#60A5FA">Telegram OGA Voice Note</text>

      <rect x="14" y="110" width="192" height="140" rx="6" fill="#171926" stroke="#252D47" stroke-width="1" />
      <text x="24" y="134" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">User Voice Recording</text>
      <g transform="translate(24, 150)">
        <!-- Waveform bars -->
        <rect x="0" y="10" width="4" height="20" fill="#3B82F6" />
        <rect x="8" y="4" width="4" height="32" fill="#60A5FA" />
        <rect x="16" y="0" width="4" height="40" fill="#D4AF37" />
        <rect x="24" y="8" width="4" height="24" fill="#3B82F6" />
        <rect x="32" y="2" width="4" height="36" fill="#60A5FA" />
        <rect x="40" y="6" width="4" height="28" fill="#D4AF37" />
        <rect x="48" y="12" width="4" height="16" fill="#3B82F6" />
        <rect x="56" y="4" width="4" height="32" fill="#60A5FA" />
        <rect x="64" y="0" width="4" height="40" fill="#D4AF37" />
        <rect x="72" y="8" width="4" height="24" fill="#3B82F6" />
        <rect x="80" y="2" width="4" height="36" fill="#60A5FA" />
        <rect x="88" y="10" width="4" height="20" fill="#3B82F6" />
        <rect x="96" y="14" width="4" height="12" fill="#3B82F6" />
        <rect x="104" y="4" width="4" height="32" fill="#60A5FA" />
        <rect x="112" y="0" width="4" height="40" fill="#D4AF37" />
        <rect x="120" y="6" width="4" height="28" fill="#3B82F6" />
        <rect x="128" y="12" width="4" height="16" fill="#3B82F6" />
        <rect x="136" y="8" width="4" height="24" fill="#60A5FA" />
      </g>
      <text x="24" y="210" class="font-mono" font-size="10" fill="#9CA3AF">Format: OGA Opus 48kHz</text>
      <text x="24" y="226" class="font-mono" font-size="10" fill="#D4AF37">Duration: 45.0 Seconds</text>

      <g transform="translate(14, 270)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Vulnerability Without Shield:</text>
        <text x="0" y="18" class="font-mono" font-size="9" fill="#EF4444">Whisper hallucinations occur on raw clips &gt;30 seconds</text>
        <text x="0" y="48" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Aegis Invariant:</text>
        <text x="0" y="66" class="font-mono" font-size="9" fill="#10B981">Zero audio drops via deterministic 25s slicing</text>
      </g>

      <rect x="14" y="420" width="192" height="40" rx="4" fill="#182333" />
      <text x="110" y="444" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#93C5FD">INBOX: telegram_inbox</text>
    </g>

    <!-- STEP 2: DETERMINISTIC SLICER -->
    <g transform="translate(246, 0)">
      <rect x="0" y="0" width="220" height="480" rx="8" fill="#12131C" stroke="#F59E0B" stroke-width="1.6" filter="url(#brutalist-shadow)" />
      <rect x="14" y="16" width="100" height="24" rx="4" fill="#3D2908" stroke="#F59E0B" stroke-width="1" />
      <text x="64" y="32" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#FDE68A">STEP 02</text>

      <text x="14" y="66" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">FFmpeg Transcoder</text>
      <text x="14" y="86" class="font-mono" font-size="10" fill="#F59E0B">25s Deterministic Chunking</text>

      <rect x="14" y="110" width="192" height="140" rx="6" fill="#1C1814" stroke="#422E10" stroke-width="1" />
      <text x="20" y="134" class="font-mono" font-size="10" font-weight="700" fill="#FDE68A">Chunk 1: 00:00 - 00:25</text>
      <rect x="20" y="142" width="180" height="16" rx="2" fill="#0A3320" stroke="#10B981" stroke-width="1" />
      <text x="26" y="154" class="font-mono" font-size="9" fill="#6EE7B7">chunk_001.ogg (25.0s) [OK]</text>

      <text x="20" y="184" class="font-mono" font-size="10" font-weight="700" fill="#FDE68A">Chunk 2: 00:25 - 00:45</text>
      <rect x="20" y="192" width="144" height="16" rx="2" fill="#0A3320" stroke="#10B981" stroke-width="1" />
      <text x="26" y="204" class="font-mono" font-size="9" fill="#6EE7B7">chunk_002.ogg (20.0s) [OK]</text>

      <g transform="translate(14, 270)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Chunking Formula:</text>
        <text x="0" y="18" class="font-mono" font-size="9" fill="#E4E4E7">ceil(duration / 25.0)</text>
        <text x="0" y="48" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Shielding Rule:</text>
        <text x="0" y="66" class="font-mono" font-size="9" fill="#10B981">Every chunk strictly &lt; 25.0s to avoid boundary clip drop</text>
      </g>

      <rect x="14" y="420" width="192" height="40" rx="4" fill="#2E210A" />
      <text x="110" y="444" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#FDE68A">STATUS: SLICED CLEAN</text>
    </g>

    <!-- STEP 3: LOCAL WHISPER STT -->
    <g transform="translate(492, 0)">
      <rect x="0" y="0" width="220" height="480" rx="8" fill="#12131C" stroke="#10B981" stroke-width="1.6" filter="url(#brutalist-shadow)" />
      <rect x="14" y="16" width="100" height="24" rx="4" fill="#083820" stroke="#10B981" stroke-width="1" />
      <text x="64" y="32" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#6EE7B7">STEP 03</text>

      <text x="14" y="66" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Local Whisper STT</text>
      <text x="14" y="86" class="font-mono" font-size="10" fill="#10B981">Offline Voice Recognition</text>

      <rect x="14" y="110" width="192" height="140" rx="6" fill="#101F18" stroke="#1D4A35" stroke-width="1" />
      <text x="20" y="134" class="font-mono" font-size="10" font-weight="700" fill="#6EE7B7">Whisper Model: base.en</text>
      <text x="20" y="154" class="font-mono" font-size="9" fill="#A7F3D0">"aegis: fix memory leak in test_token_guard and run full test suite"</text>
      <text x="20" y="210" class="font-mono" font-size="10" fill="#D4AF37">Accuracy: 99.4%</text>
      <text x="20" y="226" class="font-mono" font-size="10" fill="#10B981">Latency: 480ms (Local)</text>

      <g transform="translate(14, 270)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Privacy Guarantee:</text>
        <text x="0" y="18" class="font-mono" font-size="9" fill="#10B981">0 audio sent to cloud. Processed 100% locally on host CPU.</text>
        <text x="0" y="48" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Command Synthesis:</text>
        <text x="0" y="66" class="font-mono" font-size="9" fill="#6EE7B7">Normalizes voice directive to structured CLI arguments</text>
      </g>

      <rect x="14" y="420" width="192" height="40" rx="4" fill="#0C4A2D" />
      <text x="110" y="444" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#6EE7B7">STATUS: TRANSCRIBED</text>
    </g>

    <!-- STEP 4: TERMINAL KEYSTROKE INJECTION -->
    <g transform="translate(738, 0)">
      <rect x="0" y="0" width="222" height="480" rx="8" fill="#12131C" stroke="#D4AF37" stroke-width="1.6" filter="url(#brutalist-shadow)" />
      <rect x="14" y="16" width="100" height="24" rx="4" fill="#3D3012" stroke="#D4AF37" stroke-width="1" />
      <text x="64" y="32" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#FDE047">STEP 04</text>

      <text x="14" y="66" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">In-Flight Interrupt</text>
      <text x="14" y="86" class="font-mono" font-size="10" fill="#D4AF37">/type &lt;cmd&gt; /alt+m</text>

      <rect x="14" y="110" width="194" height="140" rx="6" fill="#1A1812" stroke="#3D3012" stroke-width="1" />
      <text x="18" y="132" class="font-mono" font-size="10" font-weight="700" fill="#FDE047">Win32 Keystroke Injection</text>
      <text x="18" y="154" class="font-mono" font-size="9" fill="#E4E4E7">Injected directly into active Antigravity CLI session:</text>
      <text x="18" y="184" class="font-mono" font-size="9" font-weight="700" fill="#10B981">&gt; git status</text>
      <text x="18" y="202" class="font-mono" font-size="9" fill="#9CA3AF">stdout streamed back to Telegram in sub-second roundtrip</text>

      <g transform="translate(14, 270)">
        <text x="0" y="0" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Remote Sovereignty:</text>
        <text x="0" y="18" class="font-mono" font-size="9" fill="#D4AF37">Control in-flight terminal while away from desk without ssh</text>
        <text x="0" y="48" class="font-mono" font-size="10" font-weight="700" fill="#E4E4E7">Telegram Notification:</text>
        <text x="0" y="66" class="font-mono" font-size="9" fill="#10B981">🏁 Execution Completed banner dispatched when test suite finishes</text>
      </g>

      <rect x="14" y="420" width="194" height="40" rx="4" fill="#3D3012" />
      <text x="111" y="444" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#FDE047">STATUS: EXECUTED</text>
    </g>
