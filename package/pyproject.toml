[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-brain"
version = "0.2.0"
description = "Local Neural Memory Bus, Sub-3ms Semantic Decision Head & Clean-Room Skill Armory for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Priyanshu Ghosh", email = "priyanshughosh97@gmail.com" }
]
keywords = ["ai-agents", "memory", "orchestration", "ollama", "antigravity", "hermes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
fast = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
