name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build packages
        run: |
          pip install --upgrade pip build
          python -m build --outdir dist package/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: AegisBrain ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
