name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Run tests
        working-directory: package
        run: python -c "import subprocess, os, sys; p = subprocess.run([sys.executable, '-m', 'pytest', 'tests', '-v', '--tb=short'], capture_output=True, text=True); sf = os.environ.get('GITHUB_STEP_SUMMARY'); (open(sf, 'a', encoding='utf-8').write(f'### Pytest Output\n```\n{p.stdout[-3500:]}\n{p.stderr[-1500:]}\n```\n') if sf else None); print(p.stdout); print(p.stderr, file=sys.stderr); sys.exit(p.returncode)"
