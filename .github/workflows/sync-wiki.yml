name: Sync Arch Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Check & Sync to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.wiki.git"
          echo "Checking if GitHub Wiki repository exists for ${REPO}..."
          if git ls-remote "${WIKI_URL}" > /dev/null 2>&1; then
            echo "GitHub Wiki detected. Cloning..."
            git clone "${WIKI_URL}" wiki_repo
            cp -r docs/wiki/* wiki_repo/
            cp -f docs/wiki/00-index.md wiki_repo/Home.md
            cd wiki_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff-index --quiet HEAD --; then
              echo "Wiki is already up to date. Zero changes."
            else
              git commit -m "docs(wiki): automated sync from docs/wiki"
              git push
              echo "Successfully synced docs/wiki to GitHub Wiki."
            fi
          else
            echo "::notice ::GitHub Wiki is not yet initialized for ${REPO}. To enable automated sync, go to repository Settings -> Features -> enable Wikis, and click 'Create the first page' in the Wiki tab."
            echo "Skipping sync gracefully (exit 0)."
          fi
